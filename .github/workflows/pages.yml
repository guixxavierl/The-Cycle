name: Publicar no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o site
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Forçar carregamento da versão atual
        shell: bash
        run: |
          VERSION="${GITHUB_SHA::12}"
          sed -i "s|href=\"styles.css\"|href=\"styles.css?v=${VERSION}\"|" index.html
          sed -i "s|href=\"polish.css\"|href=\"polish.css?v=${VERSION}\"|" index.html
          sed -i "s|src=\"script.js\"|src=\"script.js?v=${VERSION}\"|" index.html

      - name: Preparar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
